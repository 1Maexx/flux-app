<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FLUX" />
  <meta name="theme-color" content="#0A0A0F" />
  <title>FLUX – Dein ADHS-Assistent</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0F; --surface: rgba(255,255,255,0.05); --surface2: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.07); --accent: #7C6EF7; --accent2: #4ECDC4;
      --critical: #FF3B3B; --high: #FF8C00; --medium: #FFD700; --low: #4CAF50;
      --text: #E8E8F0; --muted: #666;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }
    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse at 15% 5%, rgba(124,110,247,0.18) 0%, transparent 55%), radial-gradient(ellipse at 85% 95%, rgba(78,205,196,0.12) 0%, transparent 55%); }

    /* HEADER */
    .header { padding: calc(var(--safe-top) + 14px) 20px 12px; background: rgba(10,10,15,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); position: relative; z-index: 10; flex-shrink: 0; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -1px; }
    .logo span { color: var(--accent); }
    .badges { display: flex; gap: 6px; align-items: center; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-critical { background: var(--critical); color: #fff; }
    .badge-count { background: var(--surface2); color: #aaa; }
    .focus-bar { margin-top: 10px; padding: 9px 14px; background: linear-gradient(135deg, rgba(124,110,247,0.15), rgba(124,110,247,0.04)); border: 1px solid rgba(124,110,247,0.2); border-radius: 12px; font-size: 12px; color: #B8B0FF; line-height: 1.4; }

    /* NAV */
    .nav { display: flex; gap: 2px; padding: 8px 12px; background: rgba(10,10,15,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: relative; z-index: 9; flex-shrink: 0; }
    .nav-btn { flex: 1; padding: 8px 4px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 400; cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; }
    .nav-btn.active { background: rgba(124,110,247,0.2); color: #B8B0FF; font-weight: 700; border-bottom-color: var(--accent); }

    /* CONTENT */
    .content { flex: 1; overflow: hidden; position: relative; z-index: 1; display: flex; flex-direction: column; }

    /* CHAT */
    .chat-messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
    .msg { display: flex; align-items: flex-end; gap: 8px; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .msg-bubble { max-width: 78%; padding: 11px 15px; font-size: 14px; line-height: 1.5; border-radius: 18px; }
    .msg.assistant .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.user .msg-bubble { background: linear-gradient(135deg, var(--accent), #5A4EDB); border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(124,110,247,0.3); }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 4px; text-align: right; }
    .msg-img { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }
    .msg-file { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(255,255,255,0.08); border-radius: 10px; margin-top: 6px; font-size: 12px; color: #aaa; }
    .typing { display: flex; gap: 4px; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 18px 18px 18px 4px; width: fit-content; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; } .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1);opacity:1} }

    /* INPUT AREA */
    .chat-input-area { padding: 8px 14px calc(var(--safe-bottom) + 8px); background: rgba(10,10,15,0.95); backdrop-filter: blur(24px); border-top: 1px solid var(--border); flex-shrink: 0; }
    
    /* FILE PREVIEW */
    .file-preview { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 8px; background: rgba(78,205,196,0.1); border: 1px solid rgba(78,205,196,0.2); border-radius: 12px; }
    .file-preview img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
    .file-preview-info { flex: 1; min-width: 0; }
    .file-preview-name { font-size: 12px; color: var(--accent2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-preview-type { font-size: 10px; color: #666; margin-top: 1px; }
    .file-preview-remove { background: none; border: none; color: #555; cursor: pointer; font-size: 16px; flex-shrink: 0; }

    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    .input-actions { display: flex; gap: 6px; align-items: flex-end; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; background: var(--surface2); color: #888; }
    .icon-btn.recording { background: linear-gradient(135deg,var(--critical),var(--high)); color:#fff; animation: pulse 1s infinite; }
    .icon-btn.active { background: linear-gradient(135deg, var(--accent), #5A4EDB); color:#fff; box-shadow: 0 4px 15px rgba(124,110,247,0.4); }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 4px rgba(255,59,59,0.2)} 50%{box-shadow:0 0 0 8px rgba(255,59,59,0.1)} }
    textarea.msg-input { flex: 1; padding: 11px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 22px; color: var(--text); font-size: 14px; font-family: 'DM Sans',sans-serif; resize: none; outline: none; line-height: 1.4; max-height: 96px; -webkit-appearance: none; }
    textarea.msg-input::placeholder { color: #444; }
    .rec-hint { text-align: center; font-size: 11px; color: var(--high); margin-top: 6px; }

    /* TASKS */
    .tasks-scroll { flex: 1; overflow-y: auto; padding: 14px 14px calc(var(--safe-bottom)+14px); -webkit-overflow-scrolling: touch; }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px; margin-top: 16px; }
    .section-label:first-child { margin-top: 0; }
    .task-card { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; margin-bottom: 6px; background: var(--surface); border-radius: 14px; border-left: 3px solid transparent; }
    .task-card.done { opacity: 0.4; }
    .task-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; color: #fff; font-size: 11px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; margin-top: 1px; }
    .task-check.checked { background: var(--low); border-color: var(--low); }
    .task-title { font-size: 13px; font-weight: 600; color: #ddd; line-height: 1.3; }
    .task-title.done-text { text-decoration: line-through; color: #555; }
    .task-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
    .task-date-today { color: var(--critical) !important; }
    .task-date-tomorrow { color: var(--high) !important; }
    .prio-tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 700; white-space: nowrap; margin-left: auto; flex-shrink: 0; }
    .del-btn { background: none; border: none; color: #333; cursor: pointer; font-size: 13px; padding: 2px; }
    .empty-state { text-align: center; padding: 50px 20px; color: #333; }
    .add-to-cal-btn { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: rgba(78,205,196,0.12); color: var(--accent2); border: 1px solid rgba(78,205,196,0.2); cursor: pointer; font-family: 'DM Sans',sans-serif; font-weight: 600; white-space: nowrap; }

    /* CALENDAR */
    .cal-scroll { flex: 1; overflow-y: auto; padding: 14px 14px calc(var(--safe-bottom)+14px); -webkit-overflow-scrolling: touch; }
    .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cal-nav-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); border: none; color: #fff; font-size: 18px; cursor: pointer; }
    .cal-month { font-family: 'Syne',sans-serif; font-size: 16px; font-weight: 700; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .cal-weekday { text-align: center; font-size: 10px; color: var(--muted); font-weight: 600; padding: 4px 0; }
    .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 9px; position: relative; cursor: default; }
    .cal-day.has-items { background: rgba(124,110,247,0.1); border: 1px solid rgba(124,110,247,0.18); }
    .cal-day.today { background: linear-gradient(135deg, var(--accent), #5A4EDB); font-weight: 800; }
    .day-num { font-size: 13px; color: #bbb; }
    .cal-day.today .day-num { color: #fff; }
    .day-dots { display: flex; gap: 2px; margin-top: 2px; }
    .day-dot { width: 4px; height: 4px; border-radius: 50%; }
    .upcoming-list { margin-top: 20px; }

    /* INSTALL BANNER */
    .install-banner { margin: 10px 14px 0; padding: 12px 14px; background: linear-gradient(135deg, rgba(78,205,196,0.15), rgba(78,205,196,0.05)); border: 1px solid rgba(78,205,196,0.2); border-radius: 14px; font-size: 12px; color: #9EEAE5; line-height: 1.5; display: flex; gap: 10px; align-items: flex-start; }
    .install-banner .close-btn { background: none; border: none; color: #9EEAE5; cursor: pointer; font-size: 16px; margin-left: auto; flex-shrink: 0; }

    /* TOAST */
    .toast { position: fixed; bottom: calc(var(--safe-bottom) + 90px); left: 50%; transform: translateX(-50%); background: rgba(30,30,40,0.95); border: 1px solid var(--border); backdrop-filter: blur(20px); padding: 10px 18px; border-radius: 30px; font-size: 13px; color: #ddd; z-index: 999; white-space: nowrap; pointer-events: none; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards; max-width: 90vw; white-space: normal; text-align: center; }
    @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes toastOut { to{opacity:0} }

    /* SCANNING OVERLAY */
    .scan-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .scan-spinner { width: 48px; height: 48px; border: 3px solid rgba(124,110,247,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scan-text { color: #B8B0FF; font-size: 14px; font-weight: 600; }
    .scan-sub { color: #555; font-size: 12px; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  </style>
</head>
<body>
<div class="ambient"></div>
<div id="app">

  <div class="header">
    <div class="header-top">
      <div class="logo">FLUX <span>⚡</span></div>
      <div class="badges">
        <span class="badge badge-critical" id="critical-badge" style="display:none"></span>
        <span class="badge badge-count" id="count-badge">0 offen</span>
      </div>
    </div>
    <div class="focus-bar" id="focus-bar">🎯 Sag mir was heute ansteht!</div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchView('chat')" id="nav-chat">💬 Chat</button>
    <button class="nav-btn" onclick="switchView('tasks')" id="nav-tasks">✅ Aufgaben</button>
    <button class="nav-btn" onclick="switchView('calendar')" id="nav-calendar">📅 Kalender</button>
  </div>

  <div class="install-banner" id="install-banner">
    <span>📲</span>
    <span><strong>Als App installieren:</strong> Tippe auf <strong>Teilen ↑</strong> → <strong>Zum Home-Bildschirm</strong></span>
    <button class="close-btn" onclick="document.getElementById('install-banner').remove()">✕</button>
  </div>

  <div class="content">
    <!-- CHAT -->
    <div id="view-chat" style="display:flex;flex-direction:column;height:100%">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <!-- File preview -->
        <div id="file-preview-area" style="display:none"></div>
        <div class="input-row">
          <div class="input-actions">
            <button class="icon-btn" id="mic-btn" onclick="toggleRecording()" title="Sprache">🎙</button>
            <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Foto oder PDF hochladen">📎</button>
            <input type="file" id="file-input" accept="image/*,.pdf" style="display:none" onchange="handleFileSelect(event)" />
          </div>
          <textarea class="msg-input" id="msg-input" rows="1" placeholder="Schreib, sprich oder lade ein Foto/PDF hoch…" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
          <button class="icon-btn" id="send-btn" onclick="sendMessage()">↑</button>
        </div>
        <div class="rec-hint" id="rec-hint" style="display:none">🔴 Aufnahme läuft… jetzt sprechen</div>
      </div>
    </div>

    <!-- TASKS -->
    <div id="view-tasks" style="display:none;flex-direction:column;height:100%">
      <div class="tasks-scroll" id="tasks-list"></div>
    </div>

    <!-- CALENDAR -->
    <div id="view-calendar" style="display:none;flex-direction:column;height:100%">
      <div class="cal-scroll">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
          <div class="cal-month" id="cal-month-label"></div>
          <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="upcoming-list" id="upcoming-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// SYSTEM PROMPTS
// ============================================================
const SYSTEM_PROMPT = `Du bist FLUX – ein persönlicher KI-Organisationsassistent speziell für Menschen mit ADHS. Freundlich, direkt, nicht überwältigend.

DEINE AUFGABEN:
1. Extrahiere aus jeder Nachricht oder Datei: Aufgaben, Termine, Geburtstage, Erinnerungen, Fristen
2. Bewerte Priorität: critical (heute/morgen/dringend/Frist bald), high (diese Woche), medium (dieser Monat), low (irgendwann)
3. Erkenne Schlüsselwörter: "merk dir", "erinner mich", "Geburtstag", "Termin", "nicht vergessen", "wichtig", "bis zum", "Frist", "Deadline"
4. Bei Dokumenten/Fotos: Fasse den Inhalt kurz zusammen UND extrahiere alle relevanten Aufgaben/Termine

ANTWORTE NUR mit diesem JSON (kein Markdown, keine Erklärung):
{
  "message": "Kurze freundliche Antwort auf Deutsch (max 3 Sätze, bei Dokumenten kurze Zusammenfassung einbauen)",
  "extracted_items": [
    {
      "type": "task|event|birthday|reminder",
      "title": "Kurzer Titel",
      "date": "YYYY-MM-DD oder null",
      "time": "HH:MM oder null",
      "priority": "critical|high|medium|low",
      "notes": "Details oder null"
    }
  ],
  "focus_suggestion": "Was soll die Person JETZT als nächstes tun (1 konkreter Satz)"
}`;

const FILE_PROMPT = `Du bist FLUX. Analysiere dieses Dokument/Bild für einen ADHS-Nutzer.

Extrahiere ALLE relevanten Informationen:
- Termine, Fristen, Deadlines
- Aufgaben, To-Dos, Anforderungen  
- Wichtige Namen, Adressen, Telefonnummern
- Behördliche Anforderungen oder Formulare die ausgefüllt werden müssen

ANTWORTE NUR mit diesem JSON:
{
  "message": "Kurze Zusammenfassung was das Dokument ist und was wichtig ist (2-3 Sätze, verständlich)",
  "extracted_items": [
    {
      "type": "task|event|birthday|reminder",
      "title": "Kurzer Titel",
      "date": "YYYY-MM-DD oder null",
      "time": "HH:MM oder null", 
      "priority": "critical|high|medium|low",
      "notes": "Details oder null"
    }
  ],
  "focus_suggestion": "Was muss der Nutzer als erstes tun?"
}`;

// ============================================================
// STATE
// ============================================================
const PRIO = {
  critical: { label:'Kritisch', color:'#FF3B3B', bg:'rgba(255,59,59,0.15)', icon:'🔥' },
  high:     { label:'Hoch',     color:'#FF8C00', bg:'rgba(255,140,0,0.15)',  icon:'⚡' },
  medium:   { label:'Mittel',   color:'#FFD700', bg:'rgba(255,215,0,0.15)',  icon:'📌' },
  low:      { label:'Niedrig',  color:'#4CAF50', bg:'rgba(76,175,80,0.15)', icon:'💤' },
};
const TYPE_ICON = { task:'✅', event:'📅', birthday:'🎂', reminder:'🔔' };

let state = {
  messages: [], items: [], completed: new Set(),
  calMonth: new Date(), recording: false, loading: false,
  view: 'chat', pendingFile: null,
};

try {
  const saved = localStorage.getItem('flux_v3');
  if (saved) {
    const p = JSON.parse(saved);
    state.messages = p.messages || [];
    state.items = p.items || [];
    state.completed = new Set(p.completed || []);
  }
} catch(e) {}

function saveState() {
  try {
    localStorage.setItem('flux_v3', JSON.stringify({
      messages: state.messages.slice(-40),
      items: state.items,
      completed: [...state.completed],
    }));
  } catch(e) {}
}

// ============================================================
// FILE HANDLING
// ============================================================
async function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  const isPDF = file.type === 'application/pdf';
  const isImage = file.type.startsWith('image/');
  if (!isPDF && !isImage) { showToast('Nur Bilder und PDFs werden unterstützt'); return; }

  // Read file as base64
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  state.pendingFile = { name: file.name, type: file.type, base64, isPDF, isImage };

  // Show preview
  const previewArea = document.getElementById('file-preview-area');
  let previewHTML = `<div class="file-preview">`;
  if (isImage) {
    previewHTML += `<img src="data:${file.type};base64,${base64}" alt="preview" />`;
  } else {
    previewHTML += `<div style="width:40px;height:40px;background:rgba(255,59,59,0.15);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px">📄</div>`;
  }
  previewHTML += `<div class="file-preview-info">
    <div class="file-preview-name">${escHtml(file.name)}</div>
    <div class="file-preview-type">${isPDF ? 'PDF Dokument' : 'Bild'} – wird analysiert</div>
  </div>
  <button class="file-preview-remove" onclick="clearFile()">✕</button>
  </div>`;
  previewArea.innerHTML = previewHTML;
  previewArea.style.display = 'block';

  // Auto-send for analysis if no text
  const inp = document.getElementById('msg-input');
  if (!inp.value.trim()) {
    inp.placeholder = 'Optionaler Kommentar… oder einfach ↑ drücken';
    document.getElementById('send-btn').className = 'icon-btn active';
  }
}

function clearFile() {
  state.pendingFile = null;
  document.getElementById('file-preview-area').style.display = 'none';
  document.getElementById('file-preview-area').innerHTML = '';
  document.getElementById('msg-input').placeholder = 'Schreib, sprich oder lade ein Foto/PDF hoch…';
  autoResize(document.getElementById('msg-input'));
}

function showScanOverlay(show) {
  let overlay = document.getElementById('scan-overlay');
  if (show && !overlay) {
    overlay = document.createElement('div');
    overlay.id = 'scan-overlay';
    overlay.className = 'scan-overlay';
    overlay.innerHTML = `<div class="scan-spinner"></div><div class="scan-text">Dokument wird analysiert…</div><div class="scan-sub">KI liest Termine und Aufgaben raus</div>`;
    document.body.appendChild(overlay);
  } else if (!show && overlay) {
    overlay.remove();
  }
}

// ============================================================
// VIEWS
// ============================================================
function switchView(v) {
  state.view = v;
  ['chat','tasks','calendar'].forEach(id => {
    document.getElementById('view-'+id).style.display = 'none';
    document.getElementById('nav-'+id).classList.remove('active');
  });
  document.getElementById('view-'+v).style.display = 'flex';
  document.getElementById('nav-'+v).classList.add('active');
  if (v === 'tasks') renderTasks();
  if (v === 'calendar') renderCalendar();
}

// ============================================================
// CHAT
// ============================================================
function initChat() {
  if (!state.messages.length) {
    state.messages.push({
      role: 'assistant',
      content: 'Hey! Ich bin FLUX – dein persönlicher Organisationsassistent 🧠⚡\n\nSchreib mir, sprich mit mir, oder lade ein Foto/PDF hoch – ich ziehe automatisch alle Termine und Aufgaben raus!',
      time: new Date().toISOString()
    });
  }
  renderMessages();
}

function renderMessages() {
  const el = document.getElementById('chat-messages');
  el.innerHTML = state.messages.map(m => {
    const t = m.time ? new Date(m.time).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : '';
    let content = `<div class="msg-bubble">${escHtml(m.content)}</div>`;
    if (m.imageData) content = `<div class="msg-bubble"><img class="msg-img" src="data:${m.imageType};base64,${m.imageData}" /></div>`;
    if (m.fileName) content += `<div class="msg-file">📄 ${escHtml(m.fileName)}</div>`;
    return m.role === 'assistant'
      ? `<div class="msg assistant"><div class="msg-avatar">⚡</div><div>${content}<div class="msg-time">${t}</div></div></div>`
      : `<div class="msg user"><div>${content}<div class="msg-time">${t}</div></div></div>`;
  }).join('');
  if (state.loading) {
    el.innerHTML += `<div class="msg assistant"><div class="msg-avatar">⚡</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  }
  el.scrollTop = el.scrollHeight;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 96) + 'px';
  const hasContent = el.value.trim() || state.pendingFile;
  document.getElementById('send-btn').className = 'icon-btn' + (hasContent ? ' active' : '');
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  const file = state.pendingFile;

  if (!text && !file) return;
  if (state.loading) return;

  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('send-btn').className = 'icon-btn';

  // Add user message to chat
  const userMsg = { role: 'user', content: text || (file.isPDF ? '📄 Dokument analysieren' : '🖼 Bild analysieren'), time: new Date().toISOString() };
  if (file?.isImage) { userMsg.imageData = file.base64; userMsg.imageType = file.type; userMsg.content = text || ''; }
  if (file?.isPDF) { userMsg.fileName = file.name; userMsg.content = text || ''; }
  state.messages.push(userMsg);
  clearFile();
  state.loading = true;
  renderMessages();
  if (file) showScanOverlay(true);

  try {
    let messages;

    if (file) {
      // File analysis - send directly with vision/document
      const userContent = [];
      if (file.isImage) {
        userContent.push({ type: 'image', source: { type: 'base64', media_type: file.type, data: file.base64 } });
      } else if (file.isPDF) {
        userContent.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: file.base64 } });
      }
      if (text) userContent.push({ type: 'text', text });
      else userContent.push({ type: 'text', text: 'Analysiere dieses Dokument/Bild und extrahiere alle wichtigen Infos, Termine und Aufgaben.' });
      messages = [{ role: 'user', content: userContent }];
    } else {
      // Regular chat
      messages = state.messages.slice(-12).map(m => ({ role: m.role, content: m.content || '...' }));
    }

    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        system: file ? FILE_PROMPT : SYSTEM_PROMPT,
        messages,
      })
    });

    const data = await res.json();
    const raw = (data.content || []).map(b => b.text || '').join('');
    let parsed;
    try { parsed = JSON.parse(raw.replace(/```json|```/g, '').trim()); }
    catch { parsed = { message: raw, extracted_items: [], focus_suggestion: null }; }

    showScanOverlay(false);
    state.loading = false;
    state.messages.push({ role: 'assistant', content: parsed.message || 'Analysiert!', time: new Date().toISOString() });

    if (parsed.focus_suggestion) document.getElementById('focus-bar').textContent = '🎯 ' + parsed.focus_suggestion;

    if (parsed.extracted_items?.length) {
      const newItems = parsed.extracted_items.map(item => ({
        ...item, id: Date.now() + '_' + Math.random().toString(36).slice(2), created: new Date().toISOString()
      }));
      state.items = [...state.items, ...newItems].sort((a,b) =>
        ({critical:0,high:1,medium:2,low:3}[a.priority]||3) - ({critical:0,high:1,medium:2,low:3}[b.priority]||3)
      );
      updateBadges();
      if (newItems.length) showToast(`✅ ${newItems.length} Aufgabe${newItems.length>1?'n':''} erkannt und gespeichert!`);
    }

    saveState();
    renderMessages();
  } catch(err) {
    showScanOverlay(false);
    state.loading = false;
    state.messages.push({ role: 'assistant', content: 'Kurzer Verbindungsfehler – versuch nochmal! 🔄', time: new Date().toISOString() });
    renderMessages();
  }
}

// ============================================================
// SPEECH
// ============================================================
let recognition = null;
function setupSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognition = new SR();
  recognition.lang = 'de-DE'; recognition.continuous = false; recognition.interimResults = false;
  recognition.onresult = e => { document.getElementById('msg-input').value += e.results[0][0].transcript; autoResize(document.getElementById('msg-input')); stopRec(); };
  recognition.onerror = recognition.onend = stopRec;
}
function stopRec() { state.recording = false; document.getElementById('mic-btn').className = 'icon-btn'; document.getElementById('rec-hint').style.display = 'none'; }
function toggleRecording() {
  if (!recognition) { showToast('Spracherkennung nicht verfügbar'); return; }
  if (state.recording) { recognition.stop(); }
  else { recognition.start(); state.recording = true; document.getElementById('mic-btn').className = 'icon-btn recording'; document.getElementById('rec-hint').style.display = 'block'; }
}

// ============================================================
// TASKS
// ============================================================
function renderTasks() {
  const container = document.getElementById('tasks-list');
  const active = state.items.filter(i => !state.completed.has(i.id));
  const done = state.items.filter(i => state.completed.has(i.id));
  const todayItems = active.filter(i => getDaysUntil(i.date) !== null && getDaysUntil(i.date) <= 1);
  let html = '';

  if (todayItems.length) {
    html += `<div class="section-label" style="color:#FF8C00">🎯 Heute & Morgen</div>`;
    todayItems.forEach(i => { html += taskCardHTML(i, false); });
  }
  ['critical','high','medium','low'].forEach(p => {
    const group = active.filter(i => i.priority === p && !todayItems.find(t => t.id === i.id));
    if (!group.length) return;
    html += `<div class="section-label" style="color:${PRIO[p].color}">${PRIO[p].icon} ${PRIO[p].label}</div>`;
    group.forEach(i => { html += taskCardHTML(i, false); });
  });

  if (!active.length) html += `<div class="empty-state"><span style="font-size:44px;display:block;margin-bottom:12px">✨</span><strong style="color:#666;font-size:15px">Alles erledigt!</strong><p style="font-size:13px;color:#444;margin-top:8px">Sag mir im Chat was als nächstes ansteht – oder lade ein Dokument hoch.</p></div>`;

  if (done.length) {
    html += `<div class="section-label" style="color:#333;margin-top:20px;border-top:1px solid rgba(255,255,255,0.04);padding-top:16px">✅ Erledigt (${done.length})</div>`;
    done.forEach(i => { html += taskCardHTML(i, true); });
  }
  container.innerHTML = html;
}

function taskCardHTML(item, done) {
  const p = PRIO[item.priority] || PRIO.low;
  const icon = TYPE_ICON[item.type] || '📌';
  const du = getDaysUntil(item.date);
  const dateClass = du === 0 ? 'task-date-today' : du === 1 ? 'task-date-tomorrow' : '';
  const dateLabel = item.date ? `📅 ${fmtDate(item.date)}${item.time?' '+item.time:''}${du===0?' 🔥':du===1?' ⚡':''}` : '';
  const calBtn = item.date ? `<button class="add-to-cal-btn" onclick="addToCalendar('${item.id}')">+ Kalender</button>` : '';
  return `<div class="task-card ${done?'done':''}" style="border-left-color:${done?'#222':p.color}">
    <button class="task-check ${done?'checked':''}" onclick="toggleDone('${item.id}')" style="border-color:${done?'#4CAF50':p.color}">${done?'✓':''}</button>
    <div style="flex:1;min-width:0">
      <div class="task-title ${done?'done-text':''}">${icon} ${escHtml(item.title)}</div>
      <div class="task-meta">
        ${dateLabel?`<span class="${dateClass}">${dateLabel}</span>`:''}
        ${item.notes?`<span>${escHtml(item.notes)}</span>`:''}
        ${calBtn}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
      <span class="prio-tag" style="background:${p.bg};color:${p.color}">${p.icon} ${p.label}</span>
      <button class="del-btn" onclick="deleteItem('${item.id}')">✕</button>
    </div>
  </div>`;
}

function toggleDone(id) { if(state.completed.has(id))state.completed.delete(id);else state.completed.add(id); saveState();updateBadges();renderTasks(); }
function deleteItem(id) { state.items=state.items.filter(i=>i.id!==id);state.completed.delete(id);saveState();updateBadges();if(state.view==='tasks')renderTasks();if(state.view==='calendar')renderCalendar(); }

// ============================================================
// CALENDAR
// ============================================================
function addToCalendar(itemId) {
  const item = state.items.find(i => i.id === itemId);
  if (!item || !item.date) return;
  const dtStr = item.date.replace(/-/g,'');
  const now = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let dtstart, dtend;
  if (item.time) {
    const [h,m] = item.time.split(':');
    const d = new Date(item.date+'T'+item.time+':00');
    dtstart = `DTSTART:${dtStr}T${h}${m}00`;
    const dEnd = new Date(d.getTime()+60*60000);
    dtend = `DTEND:${dtStr}T${String(dEnd.getHours()).padStart(2,'0')}${String(dEnd.getMinutes()).padStart(2,'0')}00`;
  } else {
    dtstart = `DTSTART;VALUE=DATE:${dtStr}`;
    const next = new Date(item.date+'T00:00:00'); next.setDate(next.getDate()+1);
    dtend = `DTEND;VALUE=DATE:${next.toISOString().slice(0,10).replace(/-/g,'')}`;
  }
  const alarmMin = item.type==='birthday'?1440:item.type==='event'?60:30;
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FLUX//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',`UID:${item.id}@flux`,`DTSTAMP:${now}`,dtstart,dtend,`SUMMARY:${item.title}`,
    item.notes?`DESCRIPTION:${item.notes}`:'',item.type==='birthday'?'RRULE:FREQ=YEARLY':'',
    'BEGIN:VALARM',`TRIGGER:-PT${alarmMin}M`,'ACTION:DISPLAY',`DESCRIPTION:Erinnerung: ${item.title}`,'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=item.title.replace(/\s+/g,'_')+'.ics'; a.click();
  URL.revokeObjectURL(url);
  showToast('📅 Datei öffnen → zu Apple Kalender hinzufügen!');
}

function renderCalendar() {
  const year=state.calMonth.getFullYear(), month=state.calMonth.getMonth();
  document.getElementById('cal-month-label').textContent = state.calMonth.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  const firstDay=new Date(year,month,1).getDay(), offset=(firstDay+6)%7, daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  let gridHTML = ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="cal-weekday">${d}</div>`).join('');
  for(let i=0;i<offset;i++) gridHTML+='<div></div>';
  for(let d=1;d<=daysInMonth;d++) {
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayItems=state.items.filter(i=>i.date===dateStr);
    const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const dots=dayItems.slice(0,3).map(i=>`<div class="day-dot" style="background:${(PRIO[i.priority]||PRIO.low).color}"></div>`).join('');
    gridHTML+=`<div class="cal-day${isToday?' today':''}${dayItems.length&&!isToday?' has-items':''}"><div class="day-num">${d}</div>${dots?`<div class="day-dots">${dots}</div>`:''}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = gridHTML;

  const upcoming = state.items.filter(i=>i.date&&getDaysUntil(i.date)>=0&&!state.completed.has(i.id)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);
  let upHTML = `<div class="section-label" style="color:#555">📅 Demnächst</div>`;
  if (!upcoming.length) upHTML += `<div style="color:#333;font-size:13px;text-align:center;padding:20px">Noch keine Termine – sag mir im Chat was oder lade ein Dokument hoch!</div>`;
  else upcoming.forEach(item => {
    const p=PRIO[item.priority]||PRIO.low, du=getDaysUntil(item.date), duLabel=du===0?'Heute':du===1?'Morgen':`${du}d`;
    upHTML+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:5px;background:rgba(255,255,255,0.04);border-radius:12px;border-left:3px solid ${p.color}">
      <div style="font-size:18px">${TYPE_ICON[item.type]||'📌'}</div>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:#ddd">${escHtml(item.title)}</div><div style="font-size:11px;color:#666;margin-top:2px">${fmtDate(item.date)}${item.time?' · '+item.time:''}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span style="font-size:10px;padding:2px 8px;border-radius:20px;background:${p.bg};color:${p.color};font-weight:700">${duLabel}</span>
        <button class="add-to-cal-btn" onclick="addToCalendar('${item.id}')">+ Kalender</button>
      </div>
    </div>`;
  });
  document.getElementById('upcoming-list').innerHTML = upHTML;
}

function changeMonth(dir) { state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()+dir,1); renderCalendar(); }

// ============================================================
// UTILS
// ============================================================
function getDaysUntil(dateStr) { if(!dateStr)return null; const d=new Date(dateStr+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);return Math.floor((d-t)/86400000); }
function fmtDate(dateStr) { if(!dateStr)return'';const du=getDaysUntil(dateStr);if(du===0)return'Heute';if(du===1)return'Morgen';if(du===-1)return'Gestern';const d=new Date(dateStr+'T00:00:00');if(du>0&&du<7)return d.toLocaleDateString('de-DE',{weekday:'long'});return d.toLocaleDateString('de-DE',{day:'numeric',month:'short'}); }
function escHtml(s) { if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function updateBadges() {
  const active=state.items.filter(i=>!state.completed.has(i.id)),crit=active.filter(i=>i.priority==='critical');
  const cb=document.getElementById('critical-badge');cb.style.display=crit.length?'inline-block':'none';cb.textContent=`🔥 ${crit.length} kritisch`;
  document.getElementById('count-badge').textContent=`${active.length} offen`;
  document.getElementById('nav-tasks').textContent=`✅ Aufgaben${active.length?' ('+active.length+')':''}`;
}
function showToast(msg) {
  const old=document.querySelector('.toast');if(old)old.remove();
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

// ============================================================
// INIT
// ============================================================
setupSpeech();
initChat();
updateBadges();
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
  const b=document.getElementById('install-banner'); if(b)b.remove();
}
</script>
